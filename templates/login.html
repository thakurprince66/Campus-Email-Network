<!DOCTYPE html>
<html>
<head>
    <title>Campus Email - Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-box">

    <h1>Campus Email</h1>

    <p>College Network Communication System</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="demo">
        <b>Demo Accounts</b><br>
        Prince: prince / 1234<br>
        Jason: jason / 1234
    </div>

</div>

</body>
</html>
